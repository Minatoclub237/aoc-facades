<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b958a" />
      <stop offset="55%" stop-color="#807a6e" />
      <stop offset="100%" stop-color="#615c52" />
    </linearGradient>
    <filter id="taches">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.14" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#mur)" />
  <rect width="1600" height="800" filter="url(#taches)" opacity="0.6" />

  <!-- coulures sous appuis -->
  <g fill="#5a554b" opacity="0.45">
    <rect x="300" y="470" width="230" height="180" />
    <rect x="1070" y="470" width="230" height="180" />
  </g>

  <!-- fissures -->
  <g stroke="#413d36" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M690 60 L716 190 L688 300 L730 430 L702 560 L742 720" stroke-width="3" />
    <path d="M716 190 L640 240 M730 430 L800 476 M702 560 L628 604" stroke-width="1.8" />
    <path d="M1430 120 L1456 250 L1420 360 L1462 500" stroke-width="2.4" />
    <path d="M1456 250 L1530 292" stroke-width="1.5" />
    <path d="M120 300 L168 372 L132 470" stroke-width="2" />
  </g>

  <!-- enduit décollé -->
  <g fill="#8d877a" opacity="0.9">
    <path d="M820 520 q70 -46 152 -16 q60 22 46 94 q-16 76 -112 66 q-98 -10 -86 -144 Z" />
    <path d="M430 190 q54 -30 100 4 q38 26 8 72 q-32 50 -94 22 q-48 -24 -14 -98 Z" />
  </g>

  <!-- ouvertures -->
  <g>
    <rect x="300" y="200" width="230" height="270" rx="3" fill="#2b2925" />
    <rect x="1070" y="200" width="230" height="270" rx="3" fill="#2b2925" />
  </g>
  <g fill="none" stroke="#6d685e" stroke-width="7">
    <rect x="300" y="200" width="230" height="270" rx="3" />
    <rect x="1070" y="200" width="230" height="270" rx="3" />
  </g>

  <rect width="1600" height="800" filter="url(#grain)" />

  <g>
    <rect x="60" y="52" width="330" height="46" rx="23" fill="#1a1713" fill-opacity="0.6" />
    <text x="86" y="82" fill="#ffffff" fill-opacity="0.75" font-family="Manrope, sans-serif"
          font-size="17" letter-spacing="4">PHOTO « AVANT » À FOURNIR</text>
  </g>
</svg>
