<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="enduit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe6d6" />
      <stop offset="100%" stop-color="#d3c3aa" />
    </linearGradient>
    <linearGradient id="lumiere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ea" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#fff8ea" stop-opacity="0" />
    </linearGradient>
    <filter id="taloche">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.12" numOctaves="3" seed="3" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.12" /></feComponentTransfer>
    </filter>
    <filter id="grainFin">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#enduit)" />
  <rect width="1600" height="800" filter="url(#taloche)" opacity="0.9" />
  <rect width="1600" height="800" fill="url(#lumiere)" />

  <!-- bandeaux et soubassement -->
  <rect x="0" y="132" width="1600" height="16" fill="#bda88b" opacity="0.55" />
  <rect x="0" y="640" width="1600" height="12" fill="#bda88b" opacity="0.45" />
  <rect x="0" y="652" width="1600" height="148" fill="#c9b596" opacity="0.35" />

  <!-- ouvertures, encadrements neufs -->
  <g>
    <rect x="300" y="200" width="230" height="270" rx="3" fill="#33474d" />
    <rect x="1070" y="200" width="230" height="270" rx="3" fill="#33474d" />
  </g>
  <g fill="none" stroke="#f7f0e2" stroke-width="12">
    <rect x="300" y="200" width="230" height="270" rx="3" />
    <rect x="1070" y="200" width="230" height="270" rx="3" />
  </g>
  <g fill="#f7f0e2">
    <rect x="288" y="476" width="254" height="14" rx="4" />
    <rect x="1058" y="476" width="254" height="14" rx="4" />
  </g>

  <rect width="1600" height="800" filter="url(#grainFin)" />

  <g>
    <rect x="60" y="52" width="330" height="46" rx="23" fill="#3a2f22" fill-opacity="0.5" />
    <text x="86" y="82" fill="#ffffff" fill-opacity="0.9" font-family="Manrope, sans-serif"
          font-size="17" letter-spacing="4">PHOTO « APRÈS » À FOURNIR</text>
  </g>
</svg>
